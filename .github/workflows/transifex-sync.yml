name: Sync Transifex Translations

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      push_translations:
        description: Push repository translations before pulling
        type: boolean
        default: false

concurrency:
  group: transifex-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Transifex CLI
        run: |
          curl --fail --show-error --silent --location \
            https://raw.githubusercontent.com/transifex/cli/master/install.sh | bash
          sudo mv tx /usr/local/bin/

      - name: Verify Transifex credentials
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: test -n "$TX_TOKEN"

      - name: Push source strings to Transifex
        if: github.event_name == 'schedule' || !inputs.push_translations
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: tx push --source --force

      - name: Push translations to Transifex
        if: github.event_name == 'workflow_dispatch' && inputs.push_translations
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if tx push --translation --all --force --workers 1; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Transifex upload conflicted; retrying in 30 seconds"
              sleep 30
            fi
          done
          exit 1

      - name: Pull translations
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: tx pull --all --force

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/linguaedit/translations/
          if git diff --cached --quiet; then
            echo "No translation changes"
          else
            git commit -m "i18n: sync translations from Transifex"
            git push
          fi
