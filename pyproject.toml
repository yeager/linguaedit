[build-system]
requires = ["setuptools>=68.0", "wheel", "PySide6-Essentials>=6.5"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "linguaedit"
version = "1.8.17"
description = "A Qt6/PySide6 translation file editor for PO, TS, JSON, XLIFF, Android, ARB, PHP, and YAML files"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    {name = "Daniel Nylander", email = "po@danielnylander.se"},
]
keywords = ["translation", "po", "ts", "json", "gettext", "i18n", "l10n", "qt6"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Localization",
]
dependencies = [
    "PySide6-Essentials>=6.5",
    "PySide6-Addons>=6.5",
    "polib>=1.2",
    "requests>=2.28",
    "pyenchant>=3.2",
    "PyYAML>=6.0",
    "pyobjc-framework-Cocoa>=9.0; sys_platform == 'darwin'",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
ai = ["openai>=1.0", "anthropic>=0.18"]
qa = ["svlang>=0.1.0"]
dev = ["pytest", "pytest-cov", "ruff"]

[project.scripts]
linguaedit = "linguaedit.app:main"

[project.gui-scripts]
linguaedit-gui = "linguaedit.app:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linguaedit = ["translations/*.qm", "resources/*"]

[tool.setuptools.data-files]
"share/linguaedit/flags" = ["resources/flags/*.png", "resources/flags/LICENSE"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
